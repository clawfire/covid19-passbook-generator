# Covid19-Passbook has been shut down (November 2026).
# The site now only serves the static farewell page in /shutdown.
# The previous build configuration (Parcel app + Netlify functions) is
# kept in git history: see the commit that introduced this file version.

[build]
  # No build step: the farewell page is plain static HTML.
  command = ""
  publish = "shutdown"
  # Point functions to an empty path so the old functions in netlify/functions
  # (default location) are no longer deployed.
  functions = "shutdown/no-functions"

# Every old URL (language pages, scanner, functions…) shows the farewell page.
# Non-forced: existing files in /shutdown (index.html, images) are served as-is.
# (A 301 from "/*" to "/" is dropped by Netlify as a loop, hence the rewrite.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
